<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <!-- This page is styled for a light background only (see html/body rule below). Without this,
         some browsers auto-restyle native form controls like <select> for dark mode (e.g. transparent
         background, no visible border) even while leaving the rest of an otherwise-light page alone,
         which can make a <select> look completely invisible - only its label remains visible. -->
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css" />
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css" />

    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>

    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>

    <script type="text/javascript" src="words.js"></script>
    <script type="text/javascript" src="shutters.js"></script>

    <style>
        /* This page has no dark-mode support of its own (all colors below assume a light background),
           and unlike the rest of ioBroker Admin it is not restyled by the surrounding app's dark theme
           since it is a separate document. Without an explicit background here, the <body> stays
           transparent wherever no element sets its own background (e.g. the plain hint text and the
           country/state dropdowns on the Plans tab, as opposed to the .shutters-card areas), letting the
           dark theme of the surrounding admin page show through - and since Materialize's default select
           text is dark, that made the country/state dropdowns and their text unreadable ("black on
           black") or seemingly invisible in dark mode. Forcing a fixed light background/text color here
           keeps this page's own (already light-only) styling consistent regardless of the active admin
           theme.
        */
        html, body {
            color-scheme: light;
            background-color: #fafafa;
            color: rgba(0, 0, 0, 0.87);
        }
        .shutters-tabs { margin-bottom: 10px; }
        .shutters-hint { font-size: 13px; color: #666; margin: 4px 0 14px 0; }
        .shutters-card {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 14px;
            margin-bottom: 12px;
            background: #fafafa;
        }
        .shutters-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .shutters-card-header h6 { margin: 0; }
        .shutters-card-header-toggle {
            display: flex;
            align-items: center;
            flex: 1;
            cursor: pointer;
            user-select: none;
        }
        .shutters-toggle-icon {
            display: inline-block;
            width: 18px;
            margin-right: 8px;
            font-size: 12px;
            color: #666;
        }
        .shutters-card-body { padding-top: 8px; }
        .shutters-weekday-label { margin-top: 18px; font-size: 13px; }
        .shutters-row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
        .shutters-row .input-field { padding: 0 8px; box-sizing: border-box; }
        .shutters-section-title {
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 4px;
            font-size: 13px;
            color: #555;
        }
        .shutters-remove-btn { margin-left: 8px; }
        .shutters-state-browse-btn { margin-bottom: 8px; padding: 0 8px; min-width: auto; }
        .shutters-add-btn { margin: 6px 0 20px 0; }
        table.shutters-simple-table { width: 100%; }
        table.shutters-simple-table td { padding: 2px 6px; }
        /* Lightweight state-ID picker (see openStatePicker() in shutters.js): a plain, self-contained
           overlay instead of ioBroker Admin's legacy jQuery UI/fancytree "selectID" dialog, which turned
           out too fragile to position/layer correctly together with Materialize in this admin build. */
        .shutters-picker-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .shutters-picker-overlay.open { display: flex; }
        .shutters-picker-box {
            background: #fff;
            border-radius: 4px;
            width: 700px;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .shutters-picker-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            font-weight: bold;
        }
        .shutters-picker-search {
            padding: 8px 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .shutters-picker-search input[type="text"] {
            flex: 1;
            height: 2.2rem;
            border: 1px solid #9e9e9e;
            border-radius: 3px;
            padding: 0 8px;
            box-sizing: border-box;
        }
        .shutters-picker-checkbox-label {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #555;
            white-space: nowrap;
            cursor: pointer;
        }
        .shutters-picker-checkbox-label input[type="checkbox"] {
            margin-right: 4px;
            width: auto;
        }
        .shutters-picker-list {
            flex: 1;
            overflow-y: auto;
            min-height: 300px;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }
        .shutters-picker-row {
            padding: 4px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .shutters-picker-row:hover { background: #eef6ff; }
        .shutters-picker-row .shutters-picker-id { font-family: monospace; font-size: 12px; }
        .shutters-picker-row .shutters-picker-name { font-size: 12px; color: #888; margin-left: 8px; font-style: italic; }
        .shutters-picker-row .shutters-picker-role {
            font-size: 10px;
            color: #1976d2;
            background: #e3f2fd;
            border-radius: 3px;
            padding: 1px 5px;
            margin-left: 8px;
        }
        .shutters-picker-row .shutters-picker-value {
            font-size: 12px;
            margin-left: auto;
            padding-left: 12px;
            font-family: monospace;
        }
        .shutters-picker-row .shutters-picker-value.is-true { color: #06960e; font-weight: bold; }
        .shutters-picker-row .shutters-picker-value.is-false { color: #d92626; }
        .shutters-picker-leaf .shutters-picker-id { margin-left: 24px; }
        .shutters-picker-folder .shutters-toggle-icon {
            width: 16px;
            font-size: 10px;
            color: #888;
            margin-right: 4px;
        }
        .shutters-picker-folder .shutters-picker-id { font-weight: bold; color: #444; }
        .shutters-picker-hint { padding: 8px 16px; font-size: 12px; color: #888; }
        .shutters-picker-footer {
            padding: 10px 16px;
            border-top: 1px solid #e0e0e0;
            text-align: right;
        }
    </style>

    <script type="text/javascript">
        // The load()/save() contract is required by the ioBroker "html" admin UI.
        function load(settings, onChange) {
            shuttersInitAdmin(settings || {}, onChange);
        }

        function save(callback) {
            callback(shuttersGetNativeConfig());
        }
    </script>
</head>

<body>
<div class="m adapter-container">
    <ul class="tabs shutters-tabs">
        <li class="tab col s2"><a href="#tab-coverings" class="translate">shutters</a></li>
        <li class="tab col s2"><a href="#tab-areas" class="translate">areas</a></li>
        <li class="tab col s2"><a href="#tab-weather" class="translate">weather</a></li>
        <li class="tab col s2"><a href="#tab-thresholds" class="translate">thresholds</a></li>
        <li class="tab col s2"><a href="#tab-groups" class="translate">groups</a></li>
        <li class="tab col s2"><a href="#tab-scenes" class="translate">scenes</a></li>
    </ul>

    <div id="tab-coverings" class="col s12">
        <p class="shutters-hint translate">shuttersHintText</p>
        <p>
            <button class="btn waves-effect" id="shutters-scan-btn" type="button">
                <span class="translate">scanButtonLabel</span>
            </button>
            <span id="shutters-scan-status" style="margin-left: 10px;"></span>
        </p>
        <p class="shutters-hint translate">scanHintText</p>
        <div id="shutters-coverings-container"></div>
        <button class="btn waves-effect shutters-add-btn" id="shutters-add-covering-btn" type="button">
            <span class="translate">addCoveringButton</span>
        </button>
    </div>

    <div id="tab-areas" class="col s12">
        <p class="shutters-hint translate">areasHintText</p>
        <div class="row">
            <div class="input-field col s4">
                <input id="shutters-holiday-state-id" type="text" />
                <label class="translate" for="shutters-holiday-state-id">holidayStateId</label>
            </div>
            <div class="col s2" style="margin-top: 18px;">
                <button class="btn waves-effect" id="shutters-holiday-state-id-browse" type="button">
                    <span class="translate">browseButton</span>
                </button>
            </div>
        </div>
        <p class="shutters-hint translate">holidayHintText</p>
        <div id="shutters-areas-container"></div>
        <button class="btn waves-effect shutters-add-btn" id="shutters-add-area-btn" type="button">
            <span class="translate">addAreaButton</span>
        </button>
    </div>

    <div id="tab-weather" class="col s12">
        <p class="shutters-hint translate">weatherHintText</p>
        <div id="shutters-weather-container"></div>
    </div>

    <div id="tab-thresholds" class="col s12">
        <div id="shutters-thresholds-container"></div>
    </div>

    <div id="tab-groups" class="col s12">
        <p class="shutters-hint translate">groupsHintText</p>
        <div id="shutters-groups-container"></div>
        <button class="btn waves-effect shutters-add-btn" id="shutters-add-group-btn" type="button">
            <span class="translate">addGroupButton</span>
        </button>
    </div>

    <div id="tab-scenes" class="col s12">
        <p class="shutters-hint translate">scenesHintText</p>
        <div id="shutters-scenes-container"></div>
        <button class="btn waves-effect shutters-add-btn" id="shutters-add-scene-btn" type="button">
            <span class="translate">addSceneButton</span>
        </button>
    </div>
</div>

<!-- State-ID picker overlay, see openStatePicker() in shutters.js. -->
<div class="shutters-picker-overlay" id="shutters-picker-overlay">
    <div class="shutters-picker-box">
        <div class="shutters-picker-header translate">pickerTitle</div>
        <div class="shutters-picker-search">
            <input type="text" id="shutters-picker-search-input" placeholder="..." />
            <label class="shutters-picker-checkbox-label">
                <input type="checkbox" id="shutters-picker-boolean-only" />
                <span class="translate">pickerBooleanOnlyLabel</span>
            </label>
        </div>
        <div class="shutters-picker-list" id="shutters-picker-list"></div>
        <div class="shutters-picker-footer">
            <button class="btn-flat" id="shutters-picker-cancel" type="button">
                <span class="translate">pickerCancelButton</span>
            </button>
        </div>
    </div>
</div>
</body>
</html>
